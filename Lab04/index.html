<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GESTOR DE TAREAS ACADÉMICAS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-5">
        <header class="text-center mb-4">
            <h1 class="fw-bold text-secondary">TAREAS ACADÉMICAS</h1>
        </header>

        <main>
            <div class="card shadow-sm p-4 mb-4 mx-auto" style="max-width: 600px;">
                <form id="tareas">
                    <legend class="fw-bold mb-3">Registrar Nueva Tarea</legend>
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="titulo" placeholder="Título" required>
                        <label for="titulo">Título de la Tarea</label>
                    </div>
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="curso" placeholder="Curso" required>
                        <label for="curso">Curso</label>
                    </div>
                    <div class="form-floating mb-3">
                        <input id="fecha" type="date" class="form-control" required>
                        <label for="fecha">Fecha De Entrega</label>
                    </div>
                    <div class="d-flex justify-content-end gap-2 mt-3">
                        <button type="reset" class="btn btn-outline-secondary">Cancelar</button>
                        <button type="submit" class="btn btn-secondary">Guardar Tarea</button>
                    </div>
                </form>
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h3 class="fw-bold mb-0">Lista de Tareas</h3>
                </div>
                <ul style="max-width: 600px;" id="lista" class="list-group shadow-sm"></ul>
            </div>
            
        </main> 

        <footer class="text-center mt-5 text-muted">
            <small>&copy; 2026 Anderson Mamani. Todos los derechos reservados.</small>
        </footer>

    </div>
    <script src="app.js"></script>
</body>
</html>
